name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Integration Tests (Real Postgres 16)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mawid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mawid_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mawid_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/mawid_test?schema=public
          JWT_SECRET: ci_pipeline_super_secret_test_key_at_least_32_chars
          JWT_EXPIRES_IN: 1h
        run: npm test

  docker-build:
    name: Build Production Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t mawid-api:latest .
